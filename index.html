<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3D Studio Pro - Interactive Sandbox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background: #1e1e1e; color: #ccc; }
        
        /* Layout Panels */
        #toolbar { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; gap: 8px; align-items: center; }
        #sidebar-left { width: 260px; background: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 10px; z-index: 5; margin-top: 55px; }
        #viewport { flex-grow: 1; position: relative; cursor: crosshair; }
        #sidebar-right { width: 320px; background: #252526; border-left: 1px solid #333; padding: 15px; z-index: 5; overflow-y: auto; margin-top: 55px; }

        /* UI Elements & Controls */
        button, label.upload-btn { background: #0e639c; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; display: inline-block; text-align: center; }
        button:hover, label.upload-btn:hover { background: #1177bb; }
        button.danger { background: #a80000; }
        button.danger:hover { background: #d32f2f; }
        input[type="file"] { display: none; }
        
        h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; color: #fff; border-bottom: 1px solid #444; padding-bottom: 5px; }
        
        .hierarchy-item { padding: 8px; background: #2d2d2d; margin-bottom: 4px; cursor: pointer; border-radius: 3px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; }
        .hierarchy-item:hover { background: #37373d; }
        .hierarchy-item.selected { background: #37373d; color: #fff; border-color: #0e639c; }
        .badge { font-size: 10px; background: #444; padding: 2px 6px; border-radius: 3px; color: #aaa; text-transform: uppercase; }
        .badge.apk { background: #a45000; color: #fff; }
        
        .prop-group { margin-bottom: 14px; }
        .prop-group label { display: block; font-size: 11px; margin-bottom: 5px; color: #999; text-transform: uppercase; }
        .prop-group input { width: 100%; background: #3c3c3c; border: 1px solid #555; color: #fff; padding: 6px; border-radius: 3px; font-size: 13px; }
        .prop-group input:focus { border-color: #0e639c; outline: none; }
        .prop-group p { font-size: 13px; color: #ddd; background: #2d2d2d; padding: 8px; border-radius: 3px; border: 1px solid #444; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(255,255,255,0.7); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        #instructions { position: absolute; bottom: 10px; left: 270px; background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px; font-size: 12px; pointer-events: none; z-index: 10; }
    </style>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="instructions">💡 Click viewport to look around. Use <b>W, A, S, D</b> to move. Click objects to select them.</div>

    <div id="toolbar">
        <button onclick="spawnObject('cube')">+ Spawn Cube</button>
        <button onclick="spawnObject('sphere')">+ Spawn Sphere</button>
        <button onclick="spawnObject('cylinder')">+ Spawn Cylinder</button>
        <label class="upload-btn">
            📂 Add APK
            <input type="file" accept=".apk" onchange="handleAPKUpload(event)">
        </label>
    </div>

    <div id="sidebar-left">
        <h3>Scene Hierarchy</h3>
        <div id="hierarchy-list" style="overflow-y: auto; flex-grow: 1;"></div>
    </div>

    <div id="viewport"></div>

    <div id="sidebar-right">
        <h3>Inspector</h3>
        <div id="inspector-content">
            <p style="color: #777; font-size: 12px; text-align: center; margin-top: 20px;">Click an item in the world or hierarchy to inspect, resize, or delete it.</p>
        </div>
    </div>

    <script>
        let scene, camera, renderer, selectedItem = null;
        let items = [];
        
        // Movement tracking variables
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let pitch = 0, yaw = 0, isLocked = false;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e1e1e);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / (window.innerWidth - 580), 0.1, 1000);
            camera.position.set(0, 2, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            const container = document.getElementById('viewport');
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            // Ground Grid
            const grid = new THREE.GridHelper(50, 50, 0x444444, 0x2a2a2a);
            scene.add(grid);

            // Default object
            spawnObject('cube');

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            
            // Pointer lock for looking around with mouse
            container.addEventListener('click', () => {
                container.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                isLocked = document.pointerLockElement === container;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isLocked) return;
                const sensitivity = 0.002;
                yaw -= e.movementX * sensitivity;
                pitch -= e.movementY * sensitivity;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

                const direction = new THREE.Vector3();
                direction.x = Math.sin(yaw) * Math.cos(pitch);
                direction.y = Math.sin(pitch);
                direction.z = Math.cos(yaw) * Math.cos(pitch);
                camera.lookAt(camera.position.clone().add(direction));
            });

            // Keyboard movement
            document.addEventListener('keydown', (e) => handleKey(e, true));
            document.addEventListener('keyup', (e) => handleKey(e, false));

            // Click selection inside viewport via Raycasting
            container.addEventListener('mousedown', (e) => {
                if (isLocked) return; // Ignore if looking around
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const meshes = items.filter(i => i.type === '3d').map(i => i.mesh);
                const intersects = raycaster.intersectObjects(meshes);

                if (intersects.length > 0) {
                    const clickedMesh = intersects[0].object;
                    const foundItem = items.find(i => i.mesh === clickedMesh);
                    if (foundItem) selectItem(foundItem);
                }
            });

            animate();
        }

        function handleKey(e, isDown) {
            if (e.code === 'KeyW') moveForward = isDown;
            if (e.code === 'KeyS') moveBackward = isDown;
            if (e.code === 'KeyA') moveLeft = isDown;
            if (e.code === 'KeyD') moveRight = isDown;
        }

        function spawnObject(type) {
            let geometry;
            if (type === 'cube') geometry = new THREE.BoxGeometry(1, 1, 1);
            if (type === 'sphere') geometry = new THREE.SphereGeometry(0.7, 32, 32);
            if (type === 'cylinder') geometry = new THREE.CylinderGeometry(0.5, 0.5, 1, 32);

            const material = new THREE.MeshStandardMaterial({ 
                color: Math.floor(Math.random()*16777215),
                roughness: 0.3
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 0.5, -3);
            
            const itemData = {
                id: 'obj_' + Date.now(),
                name: `${type.charAt(0).toUpperCase() + type.slice(1)}_${items.filter(i=>i.type==='3d').length + 1}`,
                type: '3d',
                mesh: mesh
            };
            
            scene.add(mesh);
            items.push(itemData);
            selectItem(itemData);
            updateHierarchy();
        }

        function handleAPKUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const apkData = {
                id: 'apk_' + Date.now(),
                name: file.name,
                type: 'apk',
                size: (file.size / (1024 * 1024)).toFixed(2) + ' MB'
            };

            items.push(apkData);
            selectItem(apkData);
            updateHierarchy();
            event.target.value = '';
        }

        function updateHierarchy() {
            const list = document.getElementById('hierarchy-list');
            list.innerHTML = '';
            items.forEach((item) => {
                const div = document.createElement('div');
                div.className = `hierarchy-item ${selectedItem === item ? 'selected' : ''}`;
                const badgeClass = item.type === 'apk' ? 'badge apk' : 'badge';
                div.innerHTML = `<span>${item.name}</span><span class="${badgeClass}">${item.type.toUpperCase()}</span>`;
                div.onclick = () => selectItem(item);
                list.appendChild(div);
            });
        }

        function selectItem(item) {
            selectedItem = item;
            updateHierarchy();
            updateInspector();
        }

        function updateInspector() {
            const content = document.getElementById('inspector-content');
            if (!selectedItem) {
                content.innerHTML = '<p style="color: #777; font-size: 12px; text-align: center; margin-top: 20px;">Select an item to inspect.</p>';
                return;
            }

            if (selectedItem.type === '3d') {
                content.innerHTML = `
                    <div class="prop-group"><label>Name</label><input type="text" value="${selectedItem.name}" oninput="modifyProp('name', this.value)"></div>
                    <div class="prop-group"><label>Position X</label><input type="number" step="0.1" value="${selectedItem.mesh.position.x.toFixed(2)}" oninput="modifyProp('posx', this.value)"></div>
                    <div class="prop-group"><label>Position Y</label><input type="number" step="0.1" value="${selectedItem.mesh.position.y.toFixed(2)}" oninput="modifyProp('posy', this.value)"></div>
                    <div class="prop-group"><label>Position Z</label><input type="number" step="0.1" value="${selectedItem.mesh.position.z.toFixed(2)}" oninput="modifyProp('posz', this.value)"></div>
                    <div class="prop-group"><label>Scale X (Width)</label><input type="number" step="0.1" value="${selectedItem.mesh.scale.x.toFixed(2)}" oninput="modifyProp('scalex', this.value)"></div>
                    <div class="prop-group"><label>Scale Y (Height)</label><input type="number" step="0.1" value="${selectedItem.mesh.scale.y.toFixed(2)}" oninput="modifyProp('scaley', this.value)"></div>
                    <div class="prop-group"><label>Scale Z (Depth)</label><input type="number" step="0.1" value="${selectedItem.mesh.scale.z.toFixed(2)}" oninput="modifyProp('scalez', this.value)"></div>
                    <button class="danger" style="width:100%; margin-top:10px;" onclick="deleteSelectedItem()">🗑 Delete Object</button>
                `;
            } else {
                content.innerHTML = `
                    <div class="prop-group"><label>Package Name</label><input type="text" value="${selectedItem.name}" oninput="modifyProp('name', this.value)"></div>
                    <div class="prop-group"><label>File Size</label><p>${selectedItem.size}</p></div>
                    <button class="danger" style="width:100%; margin-top:10px;" onclick="deleteSelectedItem()">🗑 Remove APK</button>
                `;
            }
        }

        function modifyProp(prop, val) {
            if (!selectedItem) return;
            if (prop === 'name') { selectedItem.name = val; updateHierarchy(); }
            if (selectedItem.type === '3d') {
                const m = selectedItem.mesh;
                if (prop === 'posx') m.position.x = parseFloat(val) || 0;
                if (prop === 'posy') m.position.y = parseFloat(val) || 0;
                if (prop === 'posz') m.position.z = parseFloat(val) || 0;
                if (prop === 'scalex') m.scale.x = Math.max(0.1, parseFloat(val) || 1);
                if (prop === 'scaley') m.scale.y = Math.max(0.1, parseFloat(val) || 1);
                if (prop === 'scalez') m.scale.z = Math.max(0.1, parseFloat(val) || 1);
            }
        }

        function deleteSelectedItem() {
            if (!selectedItem) return;
            if (selectedItem.type === '3d') {
                scene.remove(selectedItem.mesh);
                selectedItem.mesh.geometry.dispose();
                selectedItem.mesh.material.dispose();
            }
            items = items.filter(i => i !== selectedItem);
            selectedItem = null;
            updateHierarchy();
            updateInspector();
        }

        function animate() {
            requestAnimationFrame(animate);

            // Handle Camera Movement (WASD)
            const speed = 0.08;
            const dir = new THREE.Vector3();
            if (moveForward) dir.z += 1;
            if (moveBackward) dir.z -= 1;
            if (moveLeft) dir.x -= 1;
            if (moveRight) dir.x += 1;
            dir.normalize();
            
            // Rotate movement vector relative to camera look direction
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            camera.position.addScaledVector(dir, speed);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('viewport');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
